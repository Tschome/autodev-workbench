<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Embedded board debug workspace</title><desc id="desc">A top-down engineering composition showing a development board, serial data traces, and diagnostic cards.</desc><style>
:root{--c-bg:rgb(243 242 237);--c-panel:rgb(255 253 250);--c-ink:rgb(29 37 37);--c-muted:rgb(110 120 117);--c-line:rgb(199 208 201);--c-sage:rgb(189 213 199);--c-sage-deep:rgb(111 153 137);--c-blue:rgb(200 220 235);--c-blue-deep:rgb(103 137 162);--c-sand:rgb(232 215 189);--c-coral:rgb(215 158 130);--c-white:rgb(255 253 250);--c-board-plane:rgb(158 194 177);--c-chip-face:rgb(40 57 57);--c-sand-line:rgb(185 155 112);--c-chip-highlight:rgb(49 70 69)}
.bg{fill:var(--c-bg)}.panel{fill:var(--c-panel);stroke:var(--c-line);stroke-width:1.5}.ink{fill:var(--c-ink)}.muted{fill:var(--c-muted)}.line{fill:none;stroke:var(--c-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.trace{fill:none;stroke:var(--c-sage-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--c-line);stroke-width:1}.dot{fill:var(--c-coral)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>
<rect width="720" height="450" rx="28" class="bg"/>
<path d="M54 74H666M54 378H666" class="thin"/><path d="M85 52v346M635 52v346" class="thin" opacity=".5"/>
<rect x="64" y="92" width="180" height="262" rx="18" class="panel"/><text x="88" y="126" class="mono muted" font-size="11">SESSION / 01</text><text x="88" y="151" class="sans ink" font-weight="650" font-size="17">Serial stream</text>
<path d="M88 190h132M88 217h102M88 244h120M88 271h83" class="line"/><circle cx="93" cy="190" r="3" class="dot"/><circle cx="93" cy="217" r="3" fill="var(--c-sage-deep)"/><circle cx="93" cy="244" r="3" fill="var(--c-blue-deep)"/>
<text x="88" y="309" class="mono muted" font-size="10">UART 115200 8N1</text><path d="M88 325h126" class="trace"/><path d="M88 337h92" class="line"/>
<g transform="translate(274 88)"><rect x="0" y="0" width="276" height="274" rx="22" fill="var(--c-sage)" stroke="var(--c-sage-deep)" stroke-width="1.5"/><rect x="28" y="30" width="220" height="212" rx="9" fill="var(--c-board-plane)" opacity=".65" stroke="var(--c-sage-deep)"/>
<rect x="86" y="72" width="104" height="86" rx="7" fill="var(--c-ink)"/><rect x="102" y="88" width="72" height="54" rx="3" fill="var(--c-chip-face)"/><path d="M112 103h51M112 116h35M112 129h44" class="thin" stroke="var(--c-sage)"/>
<rect x="45" y="177" width="42" height="22" rx="4" fill="var(--c-panel)" stroke="var(--c-sage-deep)"/><rect x="198" y="178" width="32" height="21" rx="4" fill="var(--c-panel)" stroke="var(--c-sage-deep)"/><circle cx="56" cy="53" r="6" class="dot"/><circle cx="75" cy="53" r="6" fill="var(--c-blue-deep)"/><circle cx="94" cy="53" r="6" fill="var(--c-panel)"/>
<g class="trace"><path d="M45 211v25M61 211v25M77 211v25M199 211v25M215 211v25"/><path d="M0 55h-15M0 74h-15M0 93h-15M276 55h15M276 74h15M276 93h15M276 212h15M276 231h15"/></g><text x="30" y="268" class="mono ink" font-size="11">T32PRO / DEV BOARD</text></g>
<g><path d="M550 137c35 0 43-16 68-16" class="trace"/><path d="M550 159c47 0 54 33 68 33" class="trace"/><path d="M550 182c30 0 39 74 68 74" class="trace"/><circle cx="618" cy="121" r="4" class="dot"/><circle cx="618" cy="192" r="4" fill="var(--c-blue-deep)"/><circle cx="618" cy="266" r="4" fill="var(--c-sage-deep)"/></g>
<rect x="548" y="292" width="112" height="62" rx="12" class="panel"/><text x="564" y="317" class="mono muted" font-size="10">STATUS</text><text x="564" y="340" class="sans ink" font-size="14" font-weight="650">Serial port</text><circle cx="645" cy="335" r="5" fill="var(--c-sage-deep)"/>
</svg>