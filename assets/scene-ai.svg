<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">AI assisted board workflow</title><desc id="desc">An AI conversation card routes a clear action to a connected embedded board.</desc><style>
:root{--c-bg:rgb(242 237 229);--c-panel:rgb(255 253 250);--c-ink:rgb(29 37 37);--c-muted:rgb(110 120 117);--c-line:rgb(199 208 201);--c-sage:rgb(189 213 199);--c-sage-deep:rgb(111 153 137);--c-blue:rgb(200 220 235);--c-blue-deep:rgb(103 137 162);--c-sand:rgb(232 215 189);--c-coral:rgb(215 158 130);--c-white:rgb(255 253 250);--c-board-plane:rgb(158 194 177);--c-chip-face:rgb(40 57 57);--c-sand-line:rgb(185 155 112);--c-chip-highlight:rgb(49 70 69)}
.bg{fill:var(--c-bg)}.panel{fill:var(--c-panel);stroke:var(--c-line);stroke-width:1.5}.ink{fill:var(--c-ink)}.muted{fill:var(--c-muted)}.line{fill:none;stroke:var(--c-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.trace{fill:none;stroke:var(--c-sage-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--c-line);stroke-width:1}.dot{fill:var(--c-coral)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>
<rect width="720" height="450" rx="28" class="bg"/><path d="M58 68H662M58 382H662" class="thin"/><text x="64" y="104" class="mono muted" font-size="11">ASSIST / 03</text><text x="64" y="140" class="sans ink" font-size="27" font-weight="650">Ask. Inspect. Iterate.</text>
<g transform="translate(64 180)"><rect width="296" height="151" rx="18" class="panel"/><circle cx="30" cy="31" r="11" fill="var(--c-sage)" stroke="var(--c-sage-deep)"/><path d="M25 31h10M30 26v10" class="thin"/><text x="54" y="36" class="sans ink" font-weight="650" font-size="14">Workbench assistant</text><rect x="22" y="62" width="234" height="33" rx="9" fill="var(--c-blue)"/><text x="36" y="83" class="sans ink" font-size="12">Inspect UART boot output</text><path d="M22 113h198M22 126h159" class="line"/><circle cx="266" cy="127" r="11" fill="var(--c-ink)"/><path d="M262 127h8M266 123v8" stroke="var(--c-white)" stroke-width="1.5"/></g>
<path d="M360 255h82" class="trace"/><path d="M418 249l24 6-24 6" fill="none" stroke="var(--c-sage-deep)" stroke-width="2"/><circle cx="400" cy="255" r="5" fill="var(--c-coral)"/>
<g transform="translate(466 157)"><rect x="0" y="0" width="190" height="198" rx="18" fill="var(--c-sage)" stroke="var(--c-sage-deep)"/><rect x="28" y="37" width="134" height="84" rx="8" fill="var(--c-panel)" stroke="var(--c-sage-deep)"/><rect x="47" y="56" width="96" height="46" rx="4" fill="var(--c-ink)"/><path d="M59 70h73M59 82h56M59 94h69" stroke="var(--c-sage)" stroke-width="1.5"/><path d="M18 47H5M18 67H5M18 87H5M18 107H5M172 47h13M172 67h13M172 87h13M172 107h13" class="trace"/><circle cx="32" cy="155" r="5" class="dot"/><circle cx="50" cy="155" r="5" fill="var(--c-blue-deep)"/><circle cx="68" cy="155" r="5" fill="var(--c-panel)"/><text x="28" y="182" class="mono ink" font-size="11">DEVICE CONTEXT</text></g>
<g transform="translate(64 359)"><circle cx="4" cy="0" r="4" fill="var(--c-sage-deep)"/><text x="18" y="4" class="mono muted" font-size="10">AI SUGGESTION → DEVICE CONTEXT</text></g>
</svg>