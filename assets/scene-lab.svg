<g transform="translate(289 205)"><rect x="0" y="0" width="142" height="100" rx="15" fill="var(--c-sage)" stroke="var(--c-sage-deep)"/><rect x="34" y="27" width="74" height="46" rx="5" fill="var(--c-ink)"/><rect x="44" y="37" width="54" height="26" rx="2" fill="var(--c-chip-highlight)"/><path d="M14 25H0M14 43H0M14 61H0M128 25h14M128 43h14M128 61h14" class="trace"/><circle cx="20" cy="82" r="4" class="dot"/><circle cx="35" cy="82" r="4" fill="var(--c-blue-deep)"/><text x="14" y="93" class="mono ink" font-size="9">T32PRO</text></g>
