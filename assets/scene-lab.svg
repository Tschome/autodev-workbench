<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Workbench device lab</title><desc id="desc">Two quiet workstation silhouettes connect to a development board in a shared lab workflow.</desc><style>
:root{--c-bg:rgb(237 242 244);--c-panel:rgb(255 253 250);--c-ink:rgb(29 37 37);--c-muted:rgb(110 120 117);--c-line:rgb(199 208 201);--c-sage:rgb(189 213 199);--c-sage-deep:rgb(111 153 137);--c-blue:rgb(200 220 235);--c-blue-deep:rgb(103 137 162);--c-sand:rgb(232 215 189);--c-coral:rgb(215 158 130);--c-white:rgb(255 253 250);--c-board-plane:rgb(158 194 177);--c-chip-face:rgb(40 57 57);--c-sand-line:rgb(185 155 112);--c-chip-highlight:rgb(49 70 69)}
.bg{fill:var(--c-bg)}.panel{fill:var(--c-panel);stroke:var(--c-line);stroke-width:1.5}.ink{fill:var(--c-ink)}.muted{fill:var(--c-muted)}.line{fill:none;stroke:var(--c-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.trace{fill:none;stroke:var(--c-sage-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--c-line);stroke-width:1}.dot{fill:var(--c-coral)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>
<rect width="720" height="450" rx="28" class="bg"/><path d="M52 346H668" class="thin"/><path d="M98 62h524" class="thin" opacity=".7"/><text x="62" y="100" class="mono muted" font-size="11">WORKSPACE / 02</text><text x="62" y="132" class="sans ink" font-size="27" font-weight="650">One board, many workflows.</text><text x="62" y="157" class="sans muted" font-size="13">Observe · configure · ship</text>
<g transform="translate(70 197)"><rect width="190" height="115" rx="12" class="panel"/><rect x="20" y="18" width="150" height="77" rx="6" fill="var(--c-blue)" stroke="var(--c-blue-deep)"/><path d="M36 40h76M36 55h97M36 70h54" class="thin"/><circle cx="145" cy="72" r="4" fill="var(--c-sage-deep)"/><path d="M80 115v18M54 133h52" class="line"/><text x="20" y="151" class="mono muted" font-size="10">CONTROL DESK</text></g>
